name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build ${{ matrix.arch }}
        run: npx electron-builder --win --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: yinyun-windows-${{ matrix.arch }}
          path: release/*.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS=()
          for ARCH in x64 arm64; do
            for TYPE in Setup Portable; do
              FILE="artifacts/Yinyun-Windows-Client-$VERSION-$ARCH-$TYPE.exe"
              LABEL="音云-Windows客户端-$VERSION-$ARCH-$TYPE.exe"
              ASSETS+=("$FILE#$LABEL")
            done
          done
          gh release create "${GITHUB_REF_NAME}" "${ASSETS[@]}" \
            --title "音云 Windows客户端 ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md

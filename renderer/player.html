<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http: https: data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' http: https: blob:; img-src 'self' http: https: data: blob:; connect-src 'self' http: https:;">
  <title>音云</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <main class="player-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="../assets/icon.png" alt="音云">
        <div><strong>音云</strong><span>Windows 客户端</span></div>
      </div>

      <nav class="main-nav" aria-label="主要功能">
        <button class="nav-item" type="button" data-view="search"><i data-lucide="search"></i><span>搜索</span></button>
        <button class="nav-item" type="button" data-view="leaderboards"><i data-lucide="trophy"></i><span>排行榜</span></button>
        <button class="nav-item" type="button" data-view="artists"><i data-lucide="mic-2"></i><span>收藏歌手</span></button>
        <button class="nav-item" type="button" data-view="albums"><i data-lucide="disc-3"></i><span>收藏专辑</span></button>
        <button class="nav-item active" type="button" data-playlist="love"><i data-lucide="heart"></i><span>我喜欢的音乐</span></button>
      </nav>

      <div class="playlist-heading">
        <span>我的歌单</span>
        <button id="create-playlist" class="icon-button subtle" type="button" title="新建歌单" aria-label="新建歌单"><i data-lucide="plus"></i></button>
      </div>
      <nav id="playlist-nav" class="playlist-nav" aria-label="自建歌单"></nav>

      <div class="sidebar-bottom">
        <button id="sync-center" class="nav-item" type="button"><i data-lucide="refresh-cw"></i><span>数据同步中心</span></button>
        <button class="nav-item" type="button" data-view="about"><i data-lucide="info"></i><span>关于</span></button>
        <div class="account-line"><span id="connection-dot"></span><span id="account-name">正在连接</span></div>
      </div>
    </aside>

    <section class="content">
      <header class="content-header">
        <div class="heading-copy"><h1 id="view-title">我喜欢的音乐</h1><p id="view-subtitle">0 首歌曲</p></div>
        <div id="playlist-actions" class="header-actions hidden">
          <button id="rename-playlist" class="icon-button" type="button" title="重命名歌单" aria-label="重命名歌单"><i data-lucide="pencil"></i></button>
          <button id="delete-playlist" class="icon-button danger" type="button" title="删除歌单" aria-label="删除歌单"><i data-lucide="trash-2"></i></button>
        </div>
      </header>

      <section id="search-view" class="view hidden">
        <form id="search-form" class="search-bar">
          <i data-lucide="search"></i>
          <input id="search-input" type="search" placeholder="搜索歌曲、歌手或专辑" autocomplete="off" spellcheck="false">
          <div class="search-type-tabs" role="group" aria-label="搜索类型">
            <button type="button" class="search-type active" data-type="song">歌曲</button>
            <button type="button" class="search-type" data-type="singer">歌手</button>
            <button type="button" class="search-type" data-type="album">专辑</button>
          </div>
          <div class="source-tabs" role="group" aria-label="搜索平台">
            <button type="button" class="source-tab active" data-source="tx">TX</button>
            <button type="button" class="source-tab" data-source="wy">WY</button>
            <button type="button" class="source-tab" data-source="kw">KW</button>
            <button type="button" class="source-tab" data-source="kg">KG</button>
            <button type="button" class="source-tab" data-source="mg">MG</button>
          </div>
          <button class="primary-button" type="submit"><i data-lucide="search"></i>搜索</button>
        </form>
      </section>

      <section id="leaderboards-view" class="view hidden leaderboard-view">
        <div class="leaderboard-controls">
          <label for="leaderboard-source">平台</label>
          <select id="leaderboard-source"><option value="tx">TX</option><option value="wy">WY</option><option value="kw">KW</option><option value="kg">KG</option></select>
          <span id="leaderboard-status"></span>
        </div>
        <div id="leaderboard-list" class="leaderboard-list"></div>
      </section>

      <section id="library-view" class="view hidden library-view">
        <div id="library-toolbar" class="library-toolbar"><span id="library-kind-label"></span><button id="library-refresh" class="secondary-button" type="button"><i data-lucide="refresh-cw"></i>刷新</button></div>
        <div id="entity-list" class="entity-list"></div>
      </section>

      <section id="tracks-view" class="view tracks-view">
        <div id="tracks-toolbar" class="tracks-toolbar hidden"><button id="play-all" class="primary-button" type="button"><i data-lucide="play"></i>播放全部</button></div>
        <div class="track-columns" aria-hidden="true"><span>歌曲</span><span>专辑</span><span>平台</span><span>时长</span><span></span></div>
        <div id="track-list" class="track-list"></div>
        <div id="empty-state" class="empty-state"><i data-lucide="music-2"></i><strong>这里还没有歌曲</strong><span>搜索音乐，或从歌单中选择歌曲</span></div>
        <div id="loading-state" class="loading-state hidden"><span></span>正在读取音乐</div>
      </section>

      <section id="about-view" class="view hidden about-view">
        <img src="../assets/icon.png" alt="音云"><h2>音云 Windows 客户端</h2>
        <p>连接音云服务端，播放音乐并管理个人收藏和歌单。</p>
        <dl><div><dt>客户端版本</dt><dd id="about-version">-</dd></div><div><dt>当前账户</dt><dd id="about-account">-</dd></div><div><dt>服务端</dt><dd id="about-server">-</dd></div><div><dt>下载目录</dt><dd id="about-download-directory">首次下载时选择</dd></div></dl>
      </section>
    </section>

    <aside id="detail-panel" class="detail-panel" aria-hidden="true">
      <header><div class="detail-tabs"><button class="detail-tab active" type="button" data-panel="queue">播放队列</button><button class="detail-tab" type="button" data-panel="lyrics">歌词</button></div><button id="close-detail" class="icon-button" type="button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></header>
      <div id="queue-panel" class="detail-content"><div class="queue-heading"><span id="queue-count">0 首</span><button id="clear-queue" type="button">清空</button></div><div id="queue-list" class="queue-list"></div></div>
      <div id="lyrics-panel" class="detail-content hidden"><div id="lyrics-content" class="lyrics-content">暂无歌词</div></div>
    </aside>

    <footer class="player-bar">
      <div class="now-playing"><div id="now-cover" class="now-cover"><i data-lucide="music-2"></i></div><div class="now-copy"><strong id="now-title">尚未播放</strong><span id="now-artist">选择一首歌曲开始播放</span></div><button id="favorite-current" class="icon-button subtle" type="button" title="收藏" aria-label="收藏" disabled><i data-lucide="heart"></i></button></div>
      <div class="transport"><div class="transport-buttons"><button id="play-mode" class="icon-button subtle" type="button" title="列表循环" aria-label="列表循环"><i data-lucide="repeat-2"></i></button><button id="previous" class="icon-button subtle" type="button" title="上一首" aria-label="上一首"><i data-lucide="skip-back"></i></button><button id="play-pause" class="play-button" type="button" title="播放" aria-label="播放"><i data-lucide="play"></i></button><button id="next" class="icon-button subtle" type="button" title="下一首" aria-label="下一首"><i data-lucide="skip-forward"></i></button><button id="lyrics-toggle" class="icon-button subtle" type="button" title="歌词" aria-label="歌词"><i data-lucide="captions"></i></button></div><div class="progress-row"><span id="elapsed">0:00</span><input id="progress" type="range" min="0" max="1000" value="0" aria-label="播放进度"><span id="duration">0:00</span></div></div>
      <div class="player-tools"><select id="quality" title="播放和下载音质" aria-label="播放和下载音质"><option value="128k">标准音质</option><option value="320k">高音质</option><option value="flac">无损音质</option><option value="flac24bit">24bit 无损</option><option value="hires">高解析度</option><option value="atmos">空间音频</option><option value="atmos_plus">增强空间音频</option><option value="master">母带音质</option></select><button id="download-directory" class="icon-button subtle" type="button" title="设置 Windows 下载目录" aria-label="设置 Windows 下载目录"><i data-lucide="folder-down"></i></button><i data-lucide="volume-2" class="volume-icon"></i><input id="volume" type="range" min="0" max="100" value="80" aria-label="音量"><button id="queue-toggle" class="icon-button subtle" type="button" title="播放队列" aria-label="播放队列"><i data-lucide="list-music"></i></button></div>
    </footer>
  </main>
  <div id="playlist-menu" class="popover hidden" role="menu"></div><div id="toast" class="toast hidden" role="status"></div><audio id="audio" preload="metadata"></audio>
  <script src="../node_modules/lucide/dist/umd/lucide.js"></script><script src="player.js"></script>
</body>
</html>
